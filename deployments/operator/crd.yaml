apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vortexclusters.vortexkv.io
spec:
  group: vortexkv.io
  names:
    kind: VortexCluster
    listKind: VortexClusterList
    plural: vortexclusters
    singular: vortexcluster
    shortNames:
      - vcluster
      - vkvc
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - masters
              properties:
                masters:
                  type: integer
                  minimum: 1
                  default: 3
                  description: "Number of distributed master shards in the cluster"
                replicasPerMaster:
                  type: integer
                  minimum: 0
                  default: 1
                  description: "Number of replica nodes provisioned per master shard"
                image:
                  type: string
                  default: "garganshu9468/vortexkv:latest"
                  description: "Container image tag for VortexKV server"
                requirepass:
                  type: string
                  description: "Shared master authentication password"
                maxmemory:
                  type: string
                  default: "1gb"
                  description: "Hard memory cap per node with allkeys-lru eviction"
                storage:
                  type: object
                  properties:
                    size:
                      type: string
                      default: "10Gi"
                    storageClassName:
                      type: string
                serviceType:
                  type: string
                  enum:
                    - ClusterIP
                    - NodePort
                    - LoadBalancer
                  default: ClusterIP
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: "Current lifecycle state: Pending, Initializing, Running, Rebalancing, Failed"
                readyNodes:
                  type: integer
                masters:
                  type: integer
                replicas:
                  type: integer
                slotsAssigned:
                  type: integer
                clusterState:
                  type: string
      additionalPrinterColumns:
        - name: Masters
          type: integer
          jsonPath: .spec.masters
        - name: Replicas
          type: integer
          jsonPath: .spec.replicasPerMaster
        - name: Status
          type: string
          jsonPath: .status.phase
        - name: Ready
          type: integer
          jsonPath: .status.readyNodes
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
