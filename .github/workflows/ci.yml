name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Vet & Static Analysis
        run: go vet ./...

      - name: Run Unit Tests with Race Detector
        run: go test -v -race ./...

      - name: Build Binaries
        run: make build

      - name: Validate Server Daemon Startup & Healthz
        run: |
          ./bin/vortex-server -port 7379 -web-port 7380 -requirepass "test_pass" &
          SERVER_PID=$!
          sleep 2
          curl -s http://localhost:7380/healthz | grep -q '"status":"healthy"'
          curl -s http://localhost:7380/metrics | grep -q 'vortex_up 1'
          kill $SERVER_PID
