version: '3.8'

services:
  vortexkv:
    build:
      context: .
      dockerfile: Dockerfile
    image: garganshu9468/vortexkv:latest
    container_name: vortexkv-core
    restart: unless-stopped
    ports:
      - "7379:7379"  # RESP Redis wire protocol
      - "7380:7380"  # Web Studio Command Deck & Prometheus /metrics
    environment:
      - VORTEX_PASSWORD=${VORTEX_PASSWORD:-vortex_secure_2026}
      - VORTEX_MAXMEMORY=${VORTEX_MAXMEMORY:-512mb}
    command: >
      -requirepass "${VORTEX_PASSWORD:-vortex_secure_2026}"
      -maxmemory "${VORTEX_MAXMEMORY:-512mb}"
      -aof-path "/data/vortex.aof"
      -aof-fsync "everysec"
    volumes:
      - vortex-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7380/healthz | grep -q '\"status\":\"healthy\"' || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '2.0'
        reservations:
          memory: 256M

  # Optional Prometheus scraper for enterprise observability
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: vortexkv-prometheus
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./deployments/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  # Optional Grafana telemetry dashboard
  grafana:
    image: grafana/grafana:10.2.0
    container_name: vortexkv-grafana
    restart: unless-stopped
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  vortex-data:
    name: vortexkv-persistence
  prometheus-data:
    name: vortexkv-prom-data
  grafana-data:
    name: vortexkv-grafana-data
