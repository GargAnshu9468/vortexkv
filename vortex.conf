# ==============================================================================
# VortexKV Production Configuration File
# ==============================================================================

# Network & Ports
bind 0.0.0.0
port 7379

# Security & Authentication
# Set a strong master password for both wire connections and Web Studio:
requirepass "changeme_to_a_strong_secret_password"

# Resource & Memory Limits
# Options: 0 (unlimited) or size with unit (e.g. 512mb, 2gb, 4gb)
maxmemory 2gb
maxmemory-policy allkeys-lru

# Max concurrent client connections
maxclients 10000

# Persistence (Append-Only File)
# Fsync policies: always | everysec | no
aof-path "/var/lib/vortexkv/vortex.aof"
aof-fsync "everysec"

# Embedded Visual Command Studio
web-enabled true
web-bind 0.0.0.0
web-port 7380

# TLS Encryption (Optional, uncomment to enable)
# tls-cert /etc/vortexkv/tls.crt
# tls-key /etc/vortexkv/tls.key
